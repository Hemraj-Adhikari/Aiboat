<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213D">
<title>Ask UK Intake — September 2026 University Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="dot"></span> <span id="brandText"></span>
    </div>
    <div class="route" aria-hidden="true">
      <span class="route-node">KTM</span>
      <span class="route-line"><span class="route-plane">✈</span></span>
      <span class="route-node">UK</span>
    </div>
    <div class="tagline" id="taglineText"></div>
  </header>

  <div id="thread" class="thread">
    <div class="intro" id="intro">
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <form id="askForm" class="askbar">
    <input id="q" type="text" autocomplete="off" placeholder="">
    <button type="submit" id="submitBtn" aria-label="Ask">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <div class="belowbar">
    <span id="statLine"></span>
    <button id="browseToggle" type="button"></button>
  </div>

  <div id="browsePanel" class="browse-panel hidden">
    <div class="filters">
      <select id="levelFilter"><option value="">All Levels</option><option value="UG">UG</option><option value="PG">PG</option></select>
      <select id="uniFilter"><option value="">All Universities</option></select>
      <select id="campusFilter"><option value="">All Campus</option></select>
    </div>
    <div id="browseResults"></div>
  </div>
</div>

<script src="lang.js"></script>
<script src="app.js"></script>
</body>
</html>
